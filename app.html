<div class="app-window" id="NotepadApp">
  <div class="app-header">
    <span class="app-title">📝 Notepad</span>
    <div class="app-controls">
      <button class="minimize-btn">–</button>
      <button class="close-btn">×</button>
    </div>
  </div>
  <div class="app-content">
    <div class="np-wrap">
      <textarea id="np-text" placeholder="Start typing… (autosaves)"></textarea>
      <div class="np-status"><span id="np-count">0 characters</span><span id="np-saved">saved</span></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
